<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Joyanta Halder</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #000; color: #fff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 35%, rgba(230,165,32,.12), transparent 42%), #000; }
      main { width: min(100%, 620px); text-align: center; }
      .eyebrow { color: #E6A520; font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
      h1 { margin: 18px 0; font-size: clamp(2.4rem, 8vw, 4.5rem); line-height: 1.05; }
      p { color: rgba(255,255,255,.65); line-height: 1.8; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 22px; padding: 0 26px; border-radius: 999px; background: linear-gradient(135deg, #E6A520, #FFD77A); color: #000; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #FFD77A; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">404 · Page not found</div>
      <h1>This page isn't here.</h1>
      <p>The link may be outdated, or the page may have moved. Head back to the portfolio to explore the latest work.</p>
      <a href="/">Back to homepage</a>
    </main>
  </body>
</html>
